  /admin/webhook-deliveries/{id}/retry:
    { parameters: *idParam, $ref: "#/components/pathItems/AdminPost" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: ee_refresh }
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/Ulid" },
      }
    Slug:
      {
        name: slug,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" },
      }
    Code:
      {
        name: code,
        in: path,
        required: true,
        schema: { type: string, maxLength: 80 },
      }
  schemas:
    Ulid:
      {
        type: string,
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$",
        example: 01J00000000000000000000000,
      }
    Money:
      { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$', example: "1850.00" }
    Meta: { type: [object, "null"], additionalProperties: true }
    SuccessEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
        requestId: { type: string, example: 01JREQUEST00000000000000000 }
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Check the submitted values. }
            fieldErrors:
              {
                type: [object, "null"],
                additionalProperties: { type: array, items: { type: string } },
              }
        requestId: { type: string, example: 01JREQUEST00000000000000000 }
    WritePayload: { type: object, additionalProperties: true }
    StaffNotification:
      type: object
      required:
        [
          id,
          event,
          category,
          severity,
          title,
          body,
          link,
          occurrences,
          occurredAt,
          readAt,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        event: { type: string, example: order.placed }
        category: { type: string, example: order }
        severity: { type: string, enum: [info, success, warning, critical] }
        title: { type: string, example: New order EE-2026-000123 }
        body: { type: [string, "null"] }
        link:
          type: [string, "null"]
          description: Same-origin admin path to act on the alert.
          example: /admin/orders/01J00000000000000000000000
        occurrences:
          type: integer
          minimum: 1
          description: Repeats collapsed into this unread alert (e.g. low stock).
        occurredAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
  requestBodies:
    JsonWrite:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WritePayload" }
  responses:
    Success:
      description: Authoritative response envelope.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/SuccessEnvelope" } },
        }
    NoContent: { description: Operation completed without a response body. }
    ValidationError:
      description: Input failed validation.
      content:
        {
          application/json:
            {
              schema: { $ref: "#/components/schemas/ErrorEnvelope" },
              example:
                {
                  error:
                    {
                      code: VALIDATION_ERROR,
                      message: Check the submitted values.,
                      fieldErrors: { phone: [Enter a valid phone number.] },
                    },
                  requestId: 01JREQUEST00000000000000000,
                },
            },
        }
    Unauthorized:
      description: Authentication is required or expired.
      content:
        {
          application/json:
            {
              schema: { $ref: "#/components/schemas/ErrorEnvelope" },
              example:
                {
                  error:
                    {
                      code: UNAUTHENTICATED,
                      message: Authentication is required.,
                    },
                  requestId: 01JREQUEST00000000000000000,
                },
            },
        }
    Forbidden:
      description: The actor lacks the required permission.
      content:
        {
          application/json:
            {
              schema: { $ref: "#/components/schemas/ErrorEnvelope" },
              example:
                {
                  error:
                    {
                      code: FORBIDDEN,
                      message: You do not have permission to perform this action.,
                    },
                  requestId: 01JREQUEST00000000000000000,
                },
            },
        }
    Conflict:
      description: State, version, or idempotency conflict.
      content:
        {
          application/json:
            {
              schema: { $ref: "#/components/schemas/ErrorEnvelope" },
              example:
                {
                  error:
                    {
                      code: VERSION_CONFLICT,
                      message: This record changed. Refresh and review it.,
                    },
                  requestId: 01JREQUEST00000000000000000,
                },
            },
        }
  pathItems:
    PublicGet:
      get:
        &publicGetOperation {
          tags: [Storefront],
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    PublicPost:
      post:
        &publicPostOperation {
          tags: [Commerce],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "201": { $ref: "#/components/responses/Success" },
              "202": { $ref: "#/components/responses/Success" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    PublicDelete:
      {
        delete:
          {
            tags: [Commerce],
            responses:
              {
                "200": { $ref: "#/components/responses/Success" },
                "204": { $ref: "#/components/responses/NoContent" },
              },
          },
      }
    PublicPatchDelete:
      patch:
        {
          tags: [Commerce],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
      delete:
        {
          tags: [Commerce],
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "204": { $ref: "#/components/responses/NoContent" },
            },
        }
    AuthGet:
      get:
        &authGetOperation {
          tags: [Account],
          security: [{ bearerAuth: [] }],
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "401": { $ref: "#/components/responses/Unauthorized" },
              "403": { $ref: "#/components/responses/Forbidden" },
            },
        }
    AuthPost:
      post:
        &authPostOperation {
          tags: [Account],
          security: [{ bearerAuth: [] }],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "401": { $ref: "#/components/responses/Unauthorized" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    AuthDelete:
      {
        delete:
          {
            tags: [Account],
            security: [{ bearerAuth: [] }],
            responses:
              {
                "200": { $ref: "#/components/responses/Success" },
                "204": { $ref: "#/components/responses/NoContent" },
                "401": { $ref: "#/components/responses/Unauthorized" },
              },
          },
      }
    AuthGetPatch:
      get: *authGetOperation
      patch:
        &authPatchOperation {
          tags: [Account],
          security: [{ bearerAuth: [] }],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    AuthGetPost: { get: *authGetOperation, post: *authPostOperation }
    AuthPatchDelete:
      {
        patch: *authPatchOperation,
        delete:
          {
            tags: [Account],
            security: [{ bearerAuth: [] }],
            responses: { "204": { $ref: "#/components/responses/NoContent" } },
          },
      }
    AuthGetPublicPost: { get: *authGetOperation, post: *publicPostOperation }
    AdminGet:
      get:
        &adminGetOperation {
          tags: [Administration],
          security: [{ bearerAuth: [] }],
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "401": { $ref: "#/components/responses/Unauthorized" },
              "403": { $ref: "#/components/responses/Forbidden" },
            },
        }
    AdminPost:
      post:
        &adminPostOperation {
          tags: [Administration],
          security: [{ bearerAuth: [] }],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "201": { $ref: "#/components/responses/Success" },
              "202": { $ref: "#/components/responses/Success" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    AdminPatch:
      patch:
        &adminPatchOperation {
          tags: [Administration],
          security: [{ bearerAuth: [] }],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    AdminPut:
      put:
        &adminPutOperation {
          tags: [Administration],
          security: [{ bearerAuth: [] }],
          requestBody: { $ref: "#/components/requestBodies/JsonWrite" },
          responses:
            {
              "200": { $ref: "#/components/responses/Success" },
              "409": { $ref: "#/components/responses/Conflict" },
              "422": { $ref: "#/components/responses/ValidationError" },
            },
        }
    AdminGetPost: { get: *adminGetOperation, post: *adminPostOperation }
    AdminGetPatch: { get: *adminGetOperation, patch: *adminPatchOperation }
    AdminGetPut: { get: *adminGetOperation, put: *adminPutOperation }
    AdminDelete:
      delete:
        &adminDeleteOperation {
          tags: [Administration],
          security: [{ bearerAuth: [] }],
          responses:
            {
              "204": { $ref: "#/components/responses/NoContent" },
              "401": { $ref: "#/components/responses/Unauthorized" },
              "403": { $ref: "#/components/responses/Forbidden" },
            },
        }
    AdminPatchDelete:
      { patch: *adminPatchOperation, delete: *adminDeleteOperation }
