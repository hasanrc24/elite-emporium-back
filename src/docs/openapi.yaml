  /admin/inbox:
    get:
      tags: [Administration]
      summary: List the signed-in staff member's dashboard notifications
      description: >-
        Newest first. Only alerts whose required permission the caller still
        holds are returned. `meta.unreadCount` counts every visible unread alert.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, unread], default: all }
        - name: category
          in: query
          schema: { type: string, pattern: "^[a-z_]{1,40}$", example: orders }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StaffNotification" }
                  meta:
                    type: object
                    required: [page, pageSize, total, pageCount, unreadCount]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      pageCount: { type: integer }
                      unreadCount: { type: integer }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/inbox/summary:
    get:
      tags: [Administration]
      summary: Unread count and newest unread alert for the admin bell
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inbox summary. Sent with `Cache-Control no-store`.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [unreadCount, latest]
                    properties:
                      unreadCount: { type: integer, example: 3 }
                      latest:
                        oneOf:
                          - { $ref: "#/components/schemas/StaffNotification" }
                          - { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/inbox/read-all:
    post:
      tags: [Administration]
      summary: Mark the caller's unread notifications as read
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  type: string
                  format: date-time
                  description: Only alerts that occurred at or before this time; defaults to now.
      responses:
        "200":
          description: Number of notifications marked read.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [updated]
                    properties: { updated: { type: integer } }
                  meta: { $ref: "#/components/schemas/Meta" }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/inbox/{id}:
    parameters: *idParam
    patch:
      tags: [Administration]
      summary: Mark one of the caller's notifications read or unread
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties: { read: { type: boolean } }
      responses:
        "200":
          description: The updated notification.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: { $ref: "#/components/schemas/StaffNotification" }
                  meta: { $ref: "#/components/schemas/Meta" }
                  requestId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not found or not visible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/reports/{report}:
    parameters:
      [{ name: report, in: path, required: true, schema: { type: string } }]
    $ref: "#/components/pathItems/AdminGet"
  /admin/reports/summary: { $ref: "#/components/pathItems/AdminGet" }
  /admin/exports: { $ref: "#/components/pathItems/AdminGetPost" }
  /admin/exports/{id}:
